[workspace]
resolver = "2"
members = [
    "crates/trustprint-core",
    "crates/trustprint-sim",
    "crates/trustprint-rtl",
    "crates/trustprint-waveform",
    "crates/trustprint-iris",
    "crates/trustprint-evidence",
    "crates/trustprint-xous-srv",
    "crates/trustprint-cli",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
authors = ["Sarang Chaudhari <sarang@trustprint.org>"]
license = "MIT"
repository = "https://github.com/baochip/dabao"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "1.0"

